<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Смачно, мамо!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-sub: #717171;
            --accent: #ff8c42;
            --accent-light: #fff2e6;
            --green: #4caf50;
            --yellow: #ffc107;
            --red: #f44336;
            --gray: #e0e0e0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 20px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .nav-tabs {
            display: flex;
            background: var(--card-bg);
            padding: 8px 16px;
            gap: 8px;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #f0f0f0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .container {
            padding: 16px;
        }

        /* Фільтри за віком */
        .age-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .age-chip {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid #ddd;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
        }

        .age-chip.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        /* Картки рецептів */
        .recipe-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .recipe-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .recipe-meta {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .badge {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Секція Алергенів/Продуктів */
        .allergen-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .allergen-item {
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .status-btns {
            display: flex;
            gap: 6px;
        }

        .status-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.1s;
        }

        .status-dot.selected {
            opacity: 1;
            transform: scale(1.15);
        }

        .dot-green { background: var(--green); }
        .dot-yellow { background: var(--yellow); }
        .dot-red { background: var(--red); }
        .dot-gray { background: #9e9e9e; }

        /* Модальне вікно рецепта */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-btn {
            float: right;
            background: #eee;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-title {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .modal-section {
            margin-top: 14px;
        }

        .modal-section h4 {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .modal-section p, .modal-section ul {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            padding-left: 16px;
        }

        .legend {
            background: var(--accent-light);
            padding: 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍲 Смачно, мамо!</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('recipes')">📖 Рецепти</button>
        <button class="tab-btn" onclick="switchTab('tracker')">🥑 Трекер продуктів</button>
    </div>

    <div class="container" id="recipes-view">
        <div class="age-filters">
            <span class="age-chip active" onclick="filterAge('all', this)">Всі віки</span>
            <span class="age-chip" onclick="filterAge('6', this)">6+ міс</span>
            <span class="age-chip" onclick="filterAge('8', this)">8+ міс</span>
            <span class="age-chip" onclick="filterAge('10', this)">10+ міс</span>
            <span class="age-chip" onclick="filterAge('12', this)">12+ міс</span>
        </div>

        <div class="age-filters" style="margin-top:-8px;">
            <span class="age-chip active" onclick="filterCat('all', this)">Всі прийоми</span>
            <span class="age-chip" onclick="filterCat('breakfast', this)">🌅 Сніданок</span>
            <span class="age-chip" onclick="filterCat('lunch', this)">🍲 Обід</span>
            <span class="age-chip" onclick="filterCat('dinner', this)">🌙 Вечеря</span>
            <span class="age-chip" onclick="filterCat('snack', this)">🥨 Перекуси</span>
        </div>

        <div class="recipe-grid" id="recipe-list">
            <!-- Рецепти завантажуються скриптом -->
        </div>
    </div>

    <div class="container" id="tracker-view" style="display: none;">
        <div class="legend">
            <div class="legend-item"><span class="status-dot dot-green selected"></span> 🟢 Введено</div>
            <div class="legend-item"><span class="status-dot dot-yellow selected"></span> 🟡 Пробуємо</div>
            <div class="legend-item"><span class="status-dot dot-red selected"></span> 🔴 Алергія / Реакція</div>
            <div class="legend-item"><span class="status-dot dot-gray selected"></span> ⚪ Ще не давали</div>
        </div>

        <div class="allergen-list" id="allergen-list">
            <!-- Список алергенів завантажується скриптом -->
        </div>
    </div>

    <!-- Модальне вікно для перегляду рецепта -->
    <div class="modal" id="recipe-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 class="modal-title" id="m-title">Назва рецепта</h2>
            <div class="recipe-meta" id="m-meta"></div>

            <div class="modal-section">
                <h4>🥗 Інгредієнти:</h4>
                <ul id="m-ingredients"></ul>
            </div>

            <div class="modal-section">
                <h4>👩‍🍳 Приготування:</h4>
                <p id="m-steps"></p>
            </div>
        </div>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // База даних рецептів
        const recipes = [
            {
                id: 1,
                title: "Овівсяно-бананові оладки",
                category: "breakfast",
                age: 8,
                time: "15 хв",
                ingredients: ["1 банан", "1 яйце (або жовток)", "3-4 ст. л. вівсяних пластівців"],
                steps: "1. Розім'яти банан виделкою.\n2. Додати яйце та збиті пластівці.\n3. Обсмажити на сухій антипригарній сковороді з двох боків."
            },
            {
                id: 2,
                title: "Пюре з кабачка та індички",
                category: "lunch",
                age: 6,
                time: "20 хв",
                ingredients: ["50g філе індички", "100g кабачка", "1 ч. л. оливкової олії"],
                steps: "1. Відварити індичку до готовності.\n2. Кабачок зварити на парі (7-10 хв).\n3. Збити все блендером до однорідності, додавши краплю олії."
            },
            {
                id: 3,
                title: "Гарбузова каша з рисом",
                category: "dinner",
                age: 8,
                time: "25 хв",
                ingredients: ["100g гарбуза", "2 ст. л. рису", "Вода або суміш/грудне молоко"],
                steps: "1. Відварити рис та гарбуз до м'якості.\n2. Перетерти або збити блендером.\n3. Довести до потрібної консистенції молочком."
            },
            {
                id: 4,
                title: "Яблучне печиво з сиром",
                category: "snack",
                age: 10,
                time: "20 хв",
                ingredients: ["100g кисломолочного сиру", "1 запечене яблуко", "1 жовток"],
                steps: "1. Змішати сир із яблучним пюре та жовтком.\n2. Сформувати невеликі печенька.\n3. Випікати при 180°C близько 15 хвилин."
            }
        ];

        // Базові алергени та продукти
        const allergens = [
            "Коров'яче молоко", "Курячі яйця", "Глютен (пшениця)", "Риба", 
            "Арахіс / Горіхи", "Соя", "Кабачок", "Броколі", "Морква", 
            "Яблуко", "Банан", "М'ясо індички", "Куряче м'ясо"
        ];

        let currentAge = 'all';
        let currentCat = 'all';

        // Завантаження збереженого стану продуктів з localStorage
        let savedTracker = JSON.parse(localStorage.getItem('mamo_tracker') || '{}');

        function renderRecipes() {
            const list = document.getElementById('recipe-list');
            list.innerHTML = '';

            const filtered = recipes.filter(r => {
                const matchAge = currentAge === 'all' || r.age <= parseInt(currentAge);
                const matchCat = currentCat === 'all' || r.category === currentCat;
                return matchAge && matchCat;
            });

            if(filtered.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">Рецептів не знайдено 🥣</p>`;
                return;
            }

            filtered.forEach(r => {
                const catNames = {breakfast: 'Сніданок', lunch: 'Обід', dinner: 'Вечеря', snack: 'Перекус'};
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.onclick = () => openModal(r);
                card.innerHTML = `
                    <div class="recipe-info">
                        <h3>${r.title}</h3>
                        <div class="recipe-meta">
                            <span class="badge">${r.age}+ міс</span>
                            <span class="badge">${catNames[r.category]}</span>
                            <span>⏱ ${r.time}</span>
                        </div>
                    </div>
                    <span style="color: var(--accent); font-weight:bold;">›</span>
                `;
                list.appendChild(card);
            });
        }

        function renderTracker() {
            const list = document.getElementById('allergen-list');
            list.innerHTML = '';

            allergens.forEach(item => {
                const currentStatus = savedTracker[item] || 'gray';
                const el = document.createElement('div');
                el.className = 'allergen-item';
                el.innerHTML = `
                    <span style="font-size:14px; font-weight:500;">${item}</span>
                    <div class="status-btns">
                        <div class="status-dot dot-green ${currentStatus === 'green' ? 'selected' : ''}" onclick="setStatus('${item}', 'green')">✓</div>
                        <div class="status-dot dot-yellow ${currentStatus === 'yellow' ? 'selected' : ''}" onclick="setStatus('${item}', 'yellow')">?</div>
                        <div class="status-dot dot-red ${currentStatus === 'red' ? 'selected' : ''}" onclick="setStatus('${item}', 'red')">✕</div>
                        <div class="status-dot dot-gray ${currentStatus === 'gray' ? 'selected' : ''}" onclick="setStatus('${item}', 'gray')">•</div>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function setStatus(item, status) {
            savedTracker[item] = status;
            localStorage.setItem('mamo_tracker', JSON.stringify(savedTracker));
            renderTracker();
        }

        function filterAge(age, el) {
            document.querySelectorAll('.age-filters')[0].querySelectorAll('.age-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentAge = age;
            renderRecipes();
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.age-filters')[1].querySelectorAll('.age-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentCat = cat;
            renderRecipes();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'recipes') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('recipes-view').style.display = 'block';
                document.getElementById('tracker-view').style.display = 'none';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('recipes-view').style.display = 'none';
                document.getElementById('tracker-view').style.display = 'block';
                renderTracker();
            }
        }

        function openModal(recipe) {
            document.getElementById('m-title').innerText = recipe.title;
            document.getElementById('m-meta').innerHTML = `<span class="badge">${recipe.age}+ місяців</span> <span>⏱ ${recipe.time}</span>`;
            
            const ingList = document.getElementById('m-ingredients');
            ingList.innerHTML = '';
            recipe.ingredients.forEach(i => {
                const li = document.createElement('li');
                li.innerText = i;
                ingList.appendChild(li);
            });

            document.getElementById('m-steps').innerText = recipe.steps;
            document.getElementById('recipe-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('recipe-modal').classList.remove('open');
        }

        // Початкова реєстрація
        renderRecipes();
    </script>
</body>
</html>
